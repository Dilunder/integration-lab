name: Verify Integration Lab
on:
  push:
    branches: [dev, prod, main]
  pull_request:
    branches: [dev, prod, main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test backend with PostgreSQL
        run: mvn -B -ntp -f backend/pom.xml verify
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Create ephemeral environment
        run: |
          echo "DATABASE_PASSWORD=$(openssl rand -hex 24)" >> .env
          echo "LAB_API_KEY=$(openssl rand -hex 24)" >> .env
          echo "LAB_INBOX_TOKEN=$(openssl rand -hex 24)" >> .env
      - name: Start local stack
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8088/api/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify CI runner
        run: |
          set -a
          source .env
          set +a
          node scripts/run-scenario.mjs examples/duplicate-fixed.json
          set +e
          node scripts/run-scenario.mjs examples/duplicate-broken.json
          result=$?
          set -e
          test "$result" -eq 1
      - name: Browser tests
        run: |
          set -a
          source .env
          set +a
          cd frontend
          npm test
      - name: Save reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            backend/target/surefire-reports
            artifacts
      - name: Stop stack
        if: always()
        run: docker compose down
