services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: integrationlab
      POSTGRES_USER: integrationlab
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integrationlab"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/integrationlab
      DATABASE_USER: integrationlab
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      LAB_API_KEY: ${LAB_API_KEY:?Set LAB_API_KEY in .env}
      LAB_INBOX_TOKEN: ${LAB_INBOX_TOKEN:?Set LAB_INBOX_TOKEN in .env}
      LAB_ALLOWED_ORIGINS: ${LAB_ALLOWED_ORIGINS:-http://demo:8090}
    depends_on:
      db:
        condition: service_healthy
  demo:
    build: ./demo-shop
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    depends_on:
      - backend
volumes:
  database:
